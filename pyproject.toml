[project]
name = "cpca"
version = "0.1.0"
description = "Causal analysis of NYC congestion pricing on MTA ridership"
requires-python = ">=3.12"
dependencies = [
  "pandas>=2.2.3,<2.3",
  "pyarrow>=17.0.0,<19",
  "pyyaml>=6",
  "python-dotenv>=1.0",
  "requests>=2.31",
  "tqdm>=4.66",
  "shapely>=2.0",
  "geopandas>=1.0",
  "contextily>=1.6",
  "pytest>=8.0",
  "matplotlib>=3.8",
  "bsts-causalimpact>=1.7",
  "pyfixest>=0.40",
  "scipy>=1.11",
  "statsmodels>=0.14",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/cpca"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
