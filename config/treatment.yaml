# CRZ definition, distance bands, treatment date(s).
# Zone assignment for Panel A is fixed here (see analysis_plan.md §4).

treatment:
  name: nyc_congestion_pricing
  t0: "2025-01-05"  # tolling begins
  # Concurrent MTA pricing bundle (fare + B&T + OMNY transition start).
  fare_change_date: "2026-01-04"

sample_windows:
  pre_start: "2022-01-03"
  pre_end: "2024-06-02"
  washout_start: "2024-06-03"
  washout_end: "2025-01-04"
  post_start: "2025-01-05"
  post_end: "2026-06-30"

# Congestion Relief Zone: Manhattan local streets at/south of 60th St.
# FDR Drive, West Side Highway/9A, Battery Park Underpass, and Hugh L. Carey
# → West Street connections are excluded from tolling.
# Official geometry: MTA CBD geofence (data.ny.gov/srxy-5nxn), built by
# `python -m cpca.geo.build_crz_polygon`.
crz:
  borough: Manhattan
  south_of_street: 60th
  inclusive_of_60th: true
  boundary_geojson: data/raw/crz/crz_boundary.geojson
  source_geojson: data/raw/crz/mta_cbd_geofence_raw.geojson
  source_dataset_id: srxy-5nxn
  # Approximate bounding box (legacy fallback only; prefer boundary_geojson).
  approx_north_lat: 40.7681
  approx_west_lon: -74.025
  approx_east_lon: -73.96
  approx_south_lat: 40.700

zone_bands:
  # Station-complex centroid rules (Panel A).
  # Assignment priority: crz > border > control (> min km) > near.
  crz: "centroid inside CRZ polygon"
  border: "Manhattan centroid between 60th and 96th St, not inside CRZ"
  border_north_street: 96th
  border_north_lat_approx: 40.788
  # Loose south bound: East Side 60th/63rd sits south of West Side 60th in WGS84.
  border_south_lat_approx: 40.761
  control: "all other complexes at least 1 km from CRZ boundary"
  control_min_distance_km: 1.0
  near: "outside CRZ/border but within control_min_distance_km (excluded from primary controls)"

robustness_bands:
  border_alt_86th_lat_approx: 40.779
  border_alt_110th_lat_approx: 40.794
  control_min_distance_km_alt: [0.5, 2.0]
