# Paths, Socrata endpoints, and download windows.
# Secrets (e.g. SOCRATA_APP_TOKEN) live in .env — never commit them.

paths:
  raw: data/raw
  interim: data/interim
  processed: data/processed
  results: results

socrata:
  domain: data.ny.gov
  # App token loaded from env: SOCRATA_APP_TOKEN
  page_size: 50000
  datasets:
    mta_subway_hourly_2020_2024:
      id: wujg-7c2s
      name: "MTA Subway Hourly Ridership: 2020-2024"
      url: https://data.ny.gov/resource/wujg-7c2s.json
    mta_subway_hourly_2025_present:
      id: 5wq4-mkjj
      name: "MTA Subway Hourly Ridership: Beginning 2025"
      url: https://data.ny.gov/resource/5wq4-mkjj.json
    mta_subway_stations:
      id: 39hk-dx4f
      name: "MTA Subway Stations"
      url: https://data.ny.gov/resource/39hk-dx4f.json
    crz_vehicle_entries:
      id: t6yz-b64h
      name: "MTA Congestion Relief Zone Vehicle Entries: Beginning 2025"
      url: https://data.ny.gov/resource/t6yz-b64h.json

mta_ridership:
  # Matches analysis_plan.md sample windows (inclusive of washout for raw pull).
  start_date: "2022-01-03"
  end_date: "2026-06-30"
  # Aggregate across payment_method / fare_class_category at pull time.
  grain: station_hour
  output_dir: data/raw/mta_subway_hourly

# First-stage / RQ2 outcome (analysis_plan.md §7). Source begins at T0
# (2025-01-05); there is no pre-toll series in this dataset. Ingest aggregates
# 10-minute source rows to day × crossing × vehicle class × time period.
crz_vehicle_entries:
  start_date: "2025-01-05"
  end_date: "2026-06-30"
  grain: day_detection_vehicle_time_period
  output_dir: data/raw/crz_vehicle_entries

noaa_ghcn:
  # Central Park daily weather covariates for Panel A (analysis_plan.md §4).
  station_id: USW00094728
  station_name: "NY CITY CENTRAL PARK, NY US"
  # Public GHCN-Daily station CSV (no API token required).
  url: https://www.ncei.noaa.gov/data/global-historical-climatology-network-daily/access/USW00094728.csv
  start_date: "2022-01-03"
  end_date: "2026-06-30"
  # Keep core covariates; GHCN stores PRCP in tenths of mm, temps in tenths of °C.
  columns: [PRCP, TMAX, TMIN, TAVG, SNOW, SNWD, AWND]
  output_path: data/raw/noaa_ghcn_central_park/daily.parquet

crz_boundary:
  # Official MTA CBD / Congestion Relief Zone geofence (data.ny.gov).
  # Manhattan at/south of 60th St, excluding FDR Drive, West Side Highway/9A,
  # Battery Park Underpass, and Hugh L. Carey Tunnel surface connections.
  socrata_id: srxy-5nxn
  name: "MTA Central Business District Geofence: Beginning June 2024"
  geojson_url: https://data.ny.gov/api/geospatial/srxy-5nxn?method=export&format=GeoJSON
  raw_path: data/raw/crz/mta_cbd_geofence_raw.geojson
  union_path: data/raw/crz/crz_boundary.geojson
  crs: EPSG:4326

station_zones:
  # Station-complex centroids from ridership partitions → zone + distance.
  output_path: data/processed/station_zones.parquet
  geojson_path: data/processed/station_zones.geojson
  # Distance CRS: NAD83 / New York Long Island (US survey feet → meters in code).
  distance_crs: EPSG:2263

panel_station_week:
  output_path: data/processed/panel_station_week.parquet
  manifest_path: data/processed/manifest.json
  # Weekday peak hour starts (local), inclusive of the hour beginning at each value.
  weekday_peak_hours: [7, 8, 9, 16, 17, 18]
  # Drop complexes missing more than this share of ISO weeks in-sample.
  min_week_coverage: 0.80
  # Keep only ISO weeks whose full Mon-Sun span lies inside [pre_start, post_end].
  # Drops partial edge weeks (e.g. week of 2026-06-29 when hard stop is 2026-06-30).
  require_complete_weeks: true
