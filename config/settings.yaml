# Paths, Socrata endpoints, and download windows.
# Secrets (e.g. SOCRATA_APP_TOKEN) live in .env — never commit them.

paths:
  raw: data/raw
  interim: data/interim
  processed: data/processed
  results: results

socrata:
  domain: data.ny.gov
  # App token loaded from env: SOCRATA_APP_TOKEN
  page_size: 50000
  datasets:
    mta_subway_hourly_2020_2024:
      id: wujg-7c2s
      name: "MTA Subway Hourly Ridership: 2020-2024"
      url: https://data.ny.gov/resource/wujg-7c2s.json
    mta_subway_hourly_2025_present:
      id: 5wq4-mkjj
      name: "MTA Subway Hourly Ridership: Beginning 2025"
      url: https://data.ny.gov/resource/5wq4-mkjj.json
    mta_subway_stations:
      id: 39hk-dx4f
      name: "MTA Subway Stations"
      url: https://data.ny.gov/resource/39hk-dx4f.json

mta_ridership:
  # Matches analysis_plan.md sample windows (inclusive of washout for raw pull).
  start_date: "2022-01-03"
  end_date: "2026-06-30"
  # Aggregate across payment_method / fare_class_category at pull time.
  grain: station_hour
  output_dir: data/raw/mta_subway_hourly
